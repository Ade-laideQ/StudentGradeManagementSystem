<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Grade Management System</h1>
        <p>Manage student records and academic results</p>
    </header>

    <main>

        <section class="dashboard">
            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="card">
                <h3>Application</h3>
                <p>C++ Powered</p>
            </div>
        </section>

        <section class="form-section">
            <h2>Register Student</h2>

            <form id="studentForm">

                <label for="name">Student Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter student name"
                    required
                >

                <label for="indexNumber">Index Number</label>
                <input
                    type="text"
                    id="indexNumber"
                    placeholder="Enter index number"
                    required
                >

                <label for="math">Mathematics Marks</label>
                <input
                    type="number"
                    id="math"
                    min="0"
                    max="100"
                    step="0.01"
                    required
                >

                <label for="english">English Marks</label>
                <input
                    type="number"
                    id="english"
                    min="0"
                    max="100"
                    step="0.01"
                    required
                >

                <label for="science">Science Marks</label>
                <input
                    type="number"
                    id="science"
                    min="0"
                    max="100"
                    step="0.01"
                    required
                >

                <button type="submit">Register Student</button>

            </form>

            <p id="message" role="status"></p>
        </section>

        <section class="records-section">

            <h2>Student Records</h2>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by index number"
                >

                <button type="button" id="searchButton">
                    Search
                </button>

                <button type="button" id="showAllButton">
                    Show All
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Index Number</th>
                            <th>Name</th>
                            <th>Maths</th>
                            <th>English</th>
                            <th>Science</th>
                            <th>Total</th>
                            <th>Average</th>
                            <th>Grade</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <footer>
        <p>Student Grade Management System | C++ Arrays Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
